го западные специалисты склонны считать значительной фигурой в разведывательном ведомстве, занимающемся нанесением вреда Сое"],["6","Мэджик Джонсон может стать мэром Лос-Анджелеса","Мэджик Джонсон может стать мэром Лос-Анджелеса. Легендарный баскетболист Мэджик Джонсон (Magic Johnson) собирается попробовать себя в политике: он заявил о потенциальной возможности баллотироваться на пост мэра Лос-Андже"],["6","По пути в Геную Буш попытается помирить ирландцев и англичан","По пути в Геную Буш попытается помирить ирландцев и англичан. Джордж Буш прибывает в Британию, где он попытается повлиять на мирный процесс в Северной Ирландии. В интервью The British Newspaper, которое он дал 18 июля, а"],["6","Бывший генерал НАТО становится аналитиком CNN","Бывший генерал НАТО становится аналитиком CNN. Бывший верховный главнокомандующий вооруженными силами НАТО в Европе, отставной генерал армии США Уэсли Кларк (Wesley Clark) cогласился стать военным аналитиком CNN. Об этом"],["6","МИД России требует от Израиля немедленно освободить собственность РПЦ в Вифлееме","МИД России требует от Израиля немедленно освободить собственность РПЦ в Вифлееме. МИД России потребовал от Израиля \"в кратчайшие сроки\" освободить принадлежащие Русской Православной Церкви участок и здание в Вифлееме, ко"],["6","Буш призовет выпускников колледжей посвятить себя служению стране","Буш призовет выпускников колледжей посвятить себя служению стране. В речи, которую президент США Джордж Буш произнесет перед выпускниками государственного университета Огайо, он обратится с призывом сделать новую \"этику "],["6","Путин рассказал послам о борьбе с терроризмом","Путин рассказал послам о борьбе с терроризмом. В среду в Кремле президент Владимир Путин принял верительные грамоты послов нескольких государств, сообщает РИА \"Новости\". Среди них были представители Венгрии, Кипра, Вьетн"],["6","США передали Совбезу ООН новый проект резолюции по Ираку","США передали Совбезу ООН новый проект резолюции по Ираку. Американская ик вечером \"Интерфаксу\" в редакции газеты, уже готовый номер за 17 апрел"],["1","Генпрокуратура Украины: Гонгадзе видели живым","Генпрокуратура Украины: Гонгадзе видели живым. Генеральная прокуратура Украины установила свидетеля, который видел пропавшего журналиста Георгия Гонгадзе живым в Чехии в феврале нынешнего года. Об этом сообщил на пресс-к"],["1","Драка в Кузьминском лесопарке: 4 человека попали в больницу","Драка в Кузьминском лесопарке: 4 человека попали в больницу. Четыре человека госпитализированы в результате драки, произошедшей в среду вечером в Москве в Кузьминском лесопарке, сообщает РИА \"Новости\". По предварительным"],["1","НТВ.Ru работает в полном объеме","НТВ.Ru работает в полном объеме. Технические проблемы, которые испытывал в последние несколько дней сервер НТВ.Ru, породили слухи и предположения. В частности, на сайте KMNews.Ru появилась информация, в соответствии с ко"],["1","Назначен новый мэр Грозного","Назначен новый мэр Грозного. Новым мэром столицы Чечни Грозного назначен уроженец города Олег Жидков. Об этом в субботу объявил полпред президента в Южном федеральном округе Виктор Казанцев. На пресс-конференции, показан"],["1","ГТК не оставит в покое \"Три кита\" и \"Гранд\"","ГТК не оставит в покое \"Три кита\" и \"Гранд\". Государственный таможенный комитет \"намерен продолжить расследование\" в отношении мебельных торговых центров \"Гранд\" и \"Три кита\", сообщает РИА \"Новости\". Об этом заявил замес"],["1","Для новой группы Бутусова нашлось название и определилась дата первого концерта","Для новой группы Бутусова нашлось название и определилась дата первого концерта. Для новой группы Вячеслава Бутусова нашлось название - не менее \"ученое\", чем \"Наутилус Помпилиус\", но более каламбурное: новая группа изве"],["1","Новости ТВ-6 можно смотреть в Интернете","Новости ТВ-6 можно смотреть в Интернете. Информационные программы ТВ-6 \"Сейчас\" и \"Грани\" можно теперь смотреть в Интернете. Ссылка-кнопка \"Эфир ТВ-6\" появилась на сайте N ны обвинения","Напавшему на воронежского священника предъявлены обвинения. Прокуратура Центрального района Воронежа во вторник предъявила обвинение Олегу Рыжикову, совершившему в начале марта вооруженное нападение на священника, сообща"],["1","Свидетелей по делу бывшего мэра Владивостока доставят в суд принудительно","Свидетелей по делу бывшего мэра Владивостока доставят в суд принудительно. Восемь свидетелей по уголовному делу бывшего мэра Владивостока Юрия Копылова, обвиняемого в превышении должностных полномочий, будут доставлены в"],["1","Узбекскую правозащитницу посадили на шесть лет","Узбекскую правозащитницу посадили на шесть лет. Суд Андижанской области Узбекистана приговорил правозащитницу Гульбахор Тураеву к шести годам тюрьмы за попытку привезти в страну оппозиционную литературу, сообщает Uznews."],["1","Московские суды завернули треть дел по \"Маршу несогласных\"","Московские суды завернули треть дел по \"Маршу несогласных\". Треть дел об административных нарушениях граждан, участвовавших 14 апреля в \"Марше несогласных\", возвращены московскими судами в милицию из-за неправильно соста"],["1","Мстислав Ростропович похоронен на Новодевичьем кладбище","Мстислав Ростропович похоронен на Новодевичьем кладбище. Тело виолончелиста и дирижера Мстислава Ростроповича предано земле, передает РИА Новости. Он похоронен на центральной аллее Новодевичьего кладбища, напротив первог"],["1","Водочный бренд \"Флагман\" продадут \"дочке\" \"Альфа-групп\"","Водочный бренд \"Флагман\" продадут \"дочке\" \"Альфа-групп\". Русская винно-водочная компания (РВВК) намерена избавиться от своего последнего алкогольного бренда - водки \"Флагман\", сообщает \"Коммерсант\" со ссылкой на анонимны"],["1","РЖД лишит Эстонию половины российского транзита","РЖД лишит Эстонию половины российского транзита. Компания \"Российские железные дороги\" (РЖД) призвала отечественные предприятия в два раза сократить экспорт нефтепродуктов, металлов и угля через Эстонию. Об этом сообщает"],["1","\"Чело  самоле"],["2","Textron будет строить бронемашины для Румынии","Textron будет строить бронемашины для Румынии. Американская компания Textron достигла соглашения с румынской Aerostar по созданию совместного предприятия на территории Румынии по производству бронемашин, сообщает Defense"],["2","Аварийные бригады подожгли нефтяное пятно в Мексиканском заливе","Аварийные бригады подожгли нефтяное пятно в Мексиканском заливе. Аварийные бригады начали жечь часть огромного нефтяного пятна, образовавшегося в Мексиканском заливе после взрыва на нефтяной платформе Deepwater Horizon, "],["2","ATK продала Армии США боеприпасов на 372 миллиона долларов","ATK продала Армии США боеприпасов на 372 миллиона долларов. Американская компания Alliant Techsystems (ATK) получила заказ Армии США на поставку боеприпасов калибра 5,56, 7,62 и 12,7 миллиметра, сообщает DefPro. Сумма сд"],["2","На дно Мексиканского залива начали спускать защитный купол","На дно Мексиканского залива начали спускать защитный купол. Специалисты компании BP начали спуск защитного купола на дно Мексиканского залива, сообщает Associated Press. 100-тонную конструкцию из бетона и стали подняли с"],["2","На дно Мексиканского залива опустили защитный купол","На дно Мексиканского залива опустили защитный купол. Команда специалистов компании BP завершила спуск на дно Мексиканского залива защитного купола, который должен перекрыть утечку нефти. Об этом сообщает Associated Press"],["2","Роскосмос объявил конкурс на создание нового модуля МКС","Роскосмос объявил конкурс на создание нового модуля МКС. Федеральное космическое агентство объявило конкурс на создание нового многоцелевого лабораторного модуля (МЛМ) МКС, который должен быть построен в 2010-2011 годах."],["2","Ускоритель элементарных частиц прояснил происхождение Свитков Мертвого моря","Ускоритель элементарных частиц прояснил происхождение Свитков Мертвого моря. Итальянские физики пришли к выводу, что так называемые Кумранские свитки были изготовлены там же, где их на опроект об исключительном использовании украинского языка","В Раду внесен законопроект об исключительном использовании украинского языка. В Верховную Раду Украины внесен законопроект «О государственном языке», предусматривающий исключительное использование украинского языка практ"],["7","Депутатов Рады пообещали лишать мандатов за двойное гражданство","Депутатов Рады пообещали лишать мандатов за двойное гражданство. Верховная Рада Украины вскоре сможет рассмотреть законопроект, предусматривающий лишение депутатского мандата при наличии двойного гражданства. Об этом в п"],["7","Порошенко отказался праздновать День Победы по московскому сценарию","Порошенко отказался праздновать День Победы по московскому сценарию. Украина отвергает попытки России использовать победу над нацизмом во Второй мировой войне для удовлетворения своих реваншистских, имперских и экспансио"],["7","Эксперты из 12 стран приехали в Россию на выборы","Эксперты из 12 стран приехали в Россию на выборы. Эксперты из 12 стран приехали в Россию на выборы, которые пройдут 10 сентября. Об этом в пятницу, 8 сентября, как сообщает ТАСС, рассказал председатель совета Российского"],["7","Молдавские депутаты вновь начали сбор подписей за импичмент Додона","Молдавские депутаты вновь начали сбор подписей за импичмент Додона. Депутаты парламента Молдавии от Либеральной партии начали сбор подписей под законопроектом о начале процедуры отстранения от должности президента Игоря "],["7","Мадрид отстранил от власти правительство Каталонии","Мадрид отстранил от власти правительство Каталонии. Председатель кабинета министров Испании Мариано Рахой отстранил от должности президента Каталонии Карлеса Пучдемона и все его правительство. В течение шести месяцев в р"],["7","Саакашвили поведал об объемах потребляемого Порошенко алкоголя","Саакашвили поведал об объемах потребляемого Порошенко алкоголя. Бывший президент Грузии, лидер «Руха новых сил» (украинское «Движение новых сил») Михаил Саакашвили рассказал, какой алкоголь пр
